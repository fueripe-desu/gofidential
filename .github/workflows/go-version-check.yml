name: Go Version Check

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  check-go-version:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
      
    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: '1.22'
    
    - name: Check for outdated dependencies
      run: |
        go list -u -m all || echo "No dependencies or updates available."

    - name: Check Go version
      run: go version

